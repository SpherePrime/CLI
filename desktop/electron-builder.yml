appId: com.sphereprime.desktop
productName: Prime Desktop
publish:
  provider: github
  owner: SpherePrime
  repo: CLI
  releaseType: release
directories:
  output: release
files:
  - out/**/*
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/koffi/**
  - node_modules/@koromix/**
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: runtime
    to: runtime
    filter:
      - prime.exe
      - manifest.json
      - remotes/**/*
win:
  target: nsis
  executableName: PrimeDesktop
  icon: build/icon.ico
  signAndEditExecutable: true
nsis:
  include: build/installer-safety.nsh
  oneClick: true
  perMachine: false
  artifactName: PrimeDesktop-Update-${version}.${ext}
  installerIcon: build/icon.ico
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
