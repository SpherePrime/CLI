appId: com.sphereprime.desktop
productName: Prime Desktop
publish:
  provider: github
  owner: SpherePrime
  repo: CLI
  releaseType: release
npmRebuild: false
directories:
  output: release
files:
  - out/**/*
  - '!release{,/**/*}'
  - '!installer{,/**/*}'
  - '!.superpowers{,/**/*}'
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/cpu-features/**'
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/koffi/**
  - node_modules/@koromix/**
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: runtime
    to: runtime
    filter:
      - prime
      - prime.exe
      - manifest.json
      - remotes/**/*
win:
  target: nsis
  executableName: PrimeDesktop
  icon: build/icon.ico
  signAndEditExecutable: true
  files:
    - out/**/*
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
nsis:
  include: build/installer-safety.nsh
  oneClick: true
  perMachine: false
  artifactName: PrimeDesktop-Update-${version}.${ext}
  installerIcon: build/icon.ico
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
linux:
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - tar.gz
  executableName: prime-desktop
  artifactName: PrimeDesktop-${version}.${ext}
  icon: build/icon.png
  category: Development
  maintainer: SpherePrime
  synopsis: Desktop workspace for Prime
  files:
    - out/**/*
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/**'
rpm:
  fpm:
    - --rpm-rpmbuild-define=_build_id_links none
