[package]
name = "prime-native"
version = "0.4.78"
edition = "2021"
rust-version = "1.85"

[lib]
name = "prime_native"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["unstable", "tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
rfd = "0.15"
open = "5"
libloading = "0.8"
url = "2"
ignore = "0.4"
similar = "2"
portable-pty = "0.9"
regex = "1"
dunce = "1"
trash = "5"
aes-gcm = "0.10"
ssh2 = "0.9.6"
keyring = { version = "4.2", features = ["v1"] }
chrono = "0.4"
chrono-tz = "0.10"
notify = "8"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
sha1 = "0.10"
unicode-normalization = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps", "Win32_System_Console"] }
ssh2 = { version = "0.9.6", features = ["openssl-on-win32", "vendored-openssl"] }
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
gtk = { version = "0.18", features = ["v3_24"] }
gdk = "0.18"
gio = "0.18"
glib = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
javascriptcore-rs = "1.1"

