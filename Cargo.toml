# Project workspace manifest
[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/agent-model",
    "crates/agent-tools",
    "crates/agent-permissions",
    "crates/agent-context",
    "crates/agent-sessions",
    "crates/agent-filesystem",
    "crates/agent-terminal",
    "crates/agent-git",
    "crates/agent-mcp",
    "crates/agent-skills",
    "crates/agent-plugins",
    "crates/agent-events",
    "crates/agent-config",
    "crates/agent-storage",
    "crates/agent-ui",
    "crates/agent-cli",
    "crates/agent-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Agent CLI Maintainers"]
repository = "https://github.com/dwertyfa288/CLI"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.28"
ratatui = "0.29"
textwrap = "0.16"
fuzzy-matcher = "0.3"
rustyline = "14"
dialoguer = { version = "0.11", features = ["fuzzy-select", "fuzzy-matcher"] }
indicatif = "0.17"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
similar = "2"
glob = "0.3"
regex = "1"
toml = "0.8"
dirs-next = "2"
async-trait = "0.1"
which = "6"
libloading = "0.8"
semver = "1"
notify = "6"
shlex = "1"
bytesize = "1"
fuzzy-file-matcher = "0.2"
is-terminal = "0.4"
libc = "0.2"
tempfile = "3"
once_cell = "1"
parking_lot = "0.12"
signal-hook = "0.3"
futures-stream = "0.3"
tokio-util = "0.7"
aes-gcm = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
