name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate snapshot tag locally
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "GORELEASER_CURRENT_TAG=v0.0.0-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> 2"
          distribution: goreleaser
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  desktop:
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: ubuntu-24.04
            bundle: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      PRIME_UPDATER_PUBLIC_KEY: ${{ vars.PRIME_UPDATER_PUBLIC_KEY }}
      PRIME_UPDATER_ENDPOINT: https://github.com/SpherePrime/CLI/releases/latest/download/latest.json
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = 'C:/msys64/mingw64/bin/gcc.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'MinGW compiler is unavailable' }
          "PRIME_NATIVE_CC=$compiler" >> $env:GITHUB_ENV
          'C:/Strawberry/perl/bin' >> $env:GITHUB_PATH
      - run: npm ci
      - name: Set native version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/set-native-version.mjs "$RELEASE_TAG"
      - name: Build signed native installer
        run: node scripts/build-native-installer.mjs "${{ matrix.bundle }}"
      - name: Build custom setup
        if: runner.os == 'Windows'
        run: node scripts/build-setup.mjs
      - name: Stage signed assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/stage-native-release.mjs "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ runner.os }}
          path: desktop/release/native/*
          if-no-files-found: error
  desktop-publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-release-*
          merge-multiple: true
          path: desktop/release/native
      - name: Publish signed native feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node desktop/scripts/publish-native-release.mjs "$RELEASE_TAG"
