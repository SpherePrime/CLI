name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, e.g. v0.4.71
        required: true

permissions:
  contents: write

jobs:
  desktop-linux:
    if: ${{ !contains(inputs.tag, '-') }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PRIME_UPDATER_PUBLIC_KEY: ${{ vars.PRIME_UPDATER_PUBLIC_KEY }}
      PRIME_UPDATER_ENDPOINT: https://github.com/SpherePrime/CLI/releases/latest/download/latest.json
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: npm ci
      - run: npm run test:packaging
      - name: Set native version
        run: node scripts/set-native-version.mjs "$RELEASE_TAG"
      - name: Build signed native installer
        run: node scripts/build-native-installer.mjs appimage,deb,rpm
      - name: Build custom Linux setup
        run: node scripts/build-setup.mjs
      - name: Stage signed assets
        run: node scripts/stage-native-release.mjs "$RELEASE_TAG"
      - name: Publish signed native feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-native-release.mjs "$RELEASE_TAG"
