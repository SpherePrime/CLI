name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: go build .
      - name: Test
        run: go test ./internal/... .
      - name: Vet
        run: go vet -copylocks=false ./internal/... .

  # The release matrix must keep compiling, or the assets the install
  # scripts and `prime update` look for stop existing.
  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release matrix
        run: |
          set -eu
          for target in \
            linux/amd64 linux/arm64 linux/386 linux/arm \
            windows/amd64 windows/arm64 windows/386 \
            darwin/amd64 darwin/arm64 \
            freebsd/amd64 freebsd/arm64 \
            openbsd/amd64 openbsd/arm64 \
            netbsd/amd64 netbsd/arm64
          do
            goos=${target%/*}
            goarch=${target#*/}
            echo "building $target"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -o /dev/null .
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check log message capitalization
        run: ./scripts/check_log_capitalization.sh
      - name: Check formatting
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofumpt -l . | tee /dev/stderr)" || (echo "gofumpt found unformatted files" && exit 1)
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run --path-mode=abs --config=.golangci.yml --timeout=5m

  # schema.json is committed; regenerate it and fail if it drifted, so the
  # published schema never describes a config the binary no longer accepts.
  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check schema.json is current
        run: |
          go run main.go schema > /tmp/schema.json
          if ! diff -u schema.json /tmp/schema.json; then
            echo "schema.json is out of date; run 'task schema'"
            exit 1
          fi