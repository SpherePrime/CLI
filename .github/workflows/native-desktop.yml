name: Native desktop checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/src-tauri/**'
      - 'desktop/src/renderer/**'
      - 'desktop/src/shared/**'
      - 'desktop/vite.native.config.ts'
      - 'desktop/package*.json'
      - 'desktop/scripts/build-desktop-engine.mjs'
      - 'cmd/desktop-engine/**'
      - 'internal/desktopengine/**'
      - 'internal/backend/**'
      - 'internal/server/**'
      - '.github/workflows/native-desktop.yml'

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - name: Select Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = 'C:/msys64/mingw64/bin/gcc.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'MinGW compiler is unavailable' }
          "PRIME_NATIVE_CC=$compiler" >> $env:GITHUB_ENV
          $perl = 'C:/Strawberry/perl/bin'
          if (!(Test-Path -LiteralPath "$perl/perl.exe")) { throw 'Strawberry Perl is required for vendored OpenSSL' }
          $perl >> $env:GITHUB_PATH
      - run: npm ci
        working-directory: desktop
      - run: npm run native:ui
        working-directory: desktop
      - run: node desktop/scripts/build-desktop-engine.mjs
      - run: go test ./internal/desktopengine ./internal/backend -timeout 180s
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib -- --test-threads=1
      - run: cargo build --manifest-path desktop/src-tauri/Cargo.toml
